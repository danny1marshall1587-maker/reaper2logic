name: Build & Release macOS DMG

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build macOS App Bundle
        run: |
          chmod +x "Launch Converter.command"
          chmod +x "REAPER to Logic Converter.app/Contents/MacOS/launcher"
          python3 create_mac_app.py

      - name: Build DMG Installer
        run: |
          mkdir -p dmg_stage
          cp -R "REAPER to Logic Converter.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "REAPER to Logic Converter" -srcfolder dmg_stage -ov -format UDZO reaper2logic.dmg
          rm -rf dmg_stage

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "reaper2logic v1.0.0"
          body: |
            ## REAPER ↔ Logic Pro Project Converter v1.0.0
            Created by **Danny Marshall**

            ### 📦 Download Instructions:
            1. Download `reaper2logic.dmg` below.
            2. Double-click `reaper2logic.dmg` to open the installer window.
            3. Drag **REAPER to Logic Converter.app** into your **Applications** folder!
          files: reaper2logic.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
